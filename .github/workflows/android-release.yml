name: Mộc Mây AI v20 Android
on:
  workflow_dispatch:
  push:
    tags: ['v20.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK/NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456"
      - name: Fetch pinned llama.cpp
        run: bash ./scripts/fetch-llama.sh
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug -PMOCMAY_WITH_LLAMA_CPP=true --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moc-may-ai-v20-debug
          path: app/build/outputs/apk/debug/*.apk
