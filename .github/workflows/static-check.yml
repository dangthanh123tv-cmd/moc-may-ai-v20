name: Mộc Mây AI static checks

on:
  pull_request:
  push:
    branches: [main, master, moc-may-ai-v29, moc-may-ai-v31]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/mocmay_llm_jni.cpp
          test -f .github/workflows/android-release.yml
          test -f app/src/main/java/com/mocmay/ai/GeminiProxyClient.java
          test -f app/src/main/java/com/mocmay/ai/UnifiedRouter.java
          test -f app/src/main/java/com/mocmay/ai/SafeCalculator.java
          test -f app/src/main/java/com/mocmay/ai/KnowledgeStore.java
          test -f app/src/main/java/com/mocmay/ai/SecurityPolicy.java
          grep -q "MOCMAY_HAS_LLAMA" app/src/main/cpp/mocmay_llm_jni.cpp
          grep -q "nativeCancelGeneration" app/src/main/java/com/mocmay/ai/NativeLlmBridge.java
          grep -q "versionName '31.0.0'" app/build.gradle
      - name: Check accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]{20,})' --exclude-dir=.git .; then
            echo 'Potential hard-coded secret detected.'
            exit 1
          fi
