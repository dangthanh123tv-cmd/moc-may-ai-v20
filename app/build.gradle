plugins { id 'com.android.application' }

android {
    namespace 'com.mocmay.ai'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mocmay.ai'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '20.0.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
                arguments '-DMOCMAY_WITH_LLAMA_CPP=' + (project.findProperty('MOCMAY_WITH_LLAMA_CPP') ?: 'OFF')
            }
        }
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
}
